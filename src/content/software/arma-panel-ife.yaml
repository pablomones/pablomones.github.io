name: arma.panel.ife
language: R
status: In development
version: 0.1.0
license: GPL-3.0
logo: ../../assets/arma-panel-ife.png
description: >-
  An R package for estimation and inference in short ARMA panels with interactive effects using
  QMLE and efficient GMM. It also provides joint selection of the ARMA orders and the number of
  factors. The package implements the methods developed in
  [*Likelihood and Order Selection for ARMA Dynamics in Panel Models with Interactive Effects*](/research/#arma-order-selection)
  (with Jushan Bai, 2026).
install: |-
  install.packages("remotes")
  remotes::install_github("pablomones/arma.panel.ife")
repo: https://github.com/pablomones/arma.panel.ife
