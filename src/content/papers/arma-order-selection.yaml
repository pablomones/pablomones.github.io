title: Likelihood and Order Selection for ARMA Dynamics in Panel Models with Interactive Effects
section: working-papers
date: 2026-11
coauthors:
  - name: Jushan Bai
# Todavía no está en arXiv: por ahora solo el PDF.
attachments:
